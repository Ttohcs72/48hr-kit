name: Marketing Agents - Analytics Sync

# The "track the results and improve" half of the system. Once a day it
# pulls real engagement numbers for everything published, and asks the
# Analytics agent to turn the best performers into plain-language
# "learnings" that the next content-pipeline.yml run reads before planning
# more content. This is what makes the system's output change over time
# instead of repeating the same guesses forever.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 12 * * *" # 12:00 UTC daily

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: agent-system/package-lock.json
      - run: npm install
      - run: npm run sync-analytics
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUSINESS_SLUG: ${{ vars.BUSINESS_SLUG }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORGANIZATION_URN: ${{ vars.LINKEDIN_ORGANIZATION_URN }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ vars.META_PAGE_ID }}
          META_INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ vars.META_INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_OPEN_ID: ${{ vars.TIKTOK_OPEN_ID }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ vars.PINTEREST_BOARD_ID }}
