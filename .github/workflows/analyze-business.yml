name: Marketing Agents - Analyze Business

# This is the entry point: point BUSINESS_WEBSITE_URL at any business's site
# (repo variable, Settings > Secrets and variables > Actions > Variables) and
# this workflow reads it and produces the structured brand profile every
# other agent grounds itself in. Runs monthly to catch site changes (new
# pricing, new testimonials), and can be run on demand any time the business
# updates its site — e.g. right after a pricing change.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 1 * *" # 06:00 UTC on the 1st of each month

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: agent-system/package-lock.json
      - run: npm install
      - run: npm run analyze-business
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUSINESS_WEBSITE_URL: ${{ vars.BUSINESS_WEBSITE_URL }}
          BUSINESS_SLUG: ${{ vars.BUSINESS_SLUG }}
