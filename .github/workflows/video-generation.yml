name: Marketing Agents - Generate Videos

# Runs after content-pipeline.yml (and after visual-generation.yml, so both
# have had time to work) and finds TikTok posts waiting on a video. Each
# post needs two ~8-second Veo clips generated and stitched together, and
# each clip generation can take several minutes on its own - this job runs
# longer than the others, hence the explicit timeout below instead of
# relying on the 6-hour default. If GEMINI_API_KEY isn't set as a secret,
# the script exits immediately after logging why.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 9 * * 1" # 09:00 UTC every Monday, after content-pipeline.yml and visual-generation.yml

jobs:
  generate-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: agent-system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: agent-system/package-lock.json
      - run: npm install
      - name: Verify ffmpeg is available
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: npm run generate-videos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUSINESS_SLUG: ${{ vars.BUSINESS_SLUG }}
